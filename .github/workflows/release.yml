name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: python
        run: |
          import pathlib
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = "${{ github.ref_name }}"
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --all-extras --no-install-project --no-build

      - name: Build distributions
        run: uv run --no-sync --no-build python -m build --no-isolation

      - name: Install built project wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python .venv/bin/python --no-build --no-deps "${wheels[0]}"

      - name: Run tests
        run: uv run --no-sync --no-build python -m pytest

      - name: Run Ruff lint
        run: uv run --no-sync --no-build python -m ruff check src tests

      - name: Check Ruff formatting
        run: uv run --no-sync --no-build python -m ruff format --check src tests

      - name: Run mypy
        run: uv run --no-sync --no-build python -m mypy src

      - name: Check distributions
        run: uv run --no-sync --no-build python -m twine check dist/*

      - name: Smoke test installed wheel and CLI
        shell: bash
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/taigeotrans-wheel-smoke" --python "$(command -v python)"
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --no-build --python "$RUNNER_TEMP/taigeotrans-wheel-smoke/bin/python" "${wheels[0]}[all]"
          cd "$RUNNER_TEMP"
          taigeotrans-wheel-smoke/bin/python -c "from taigeotrans import TaiGeotrans, TransformStatus; result = TaiGeotrans().transform_lonlat(121.5654, 25.0330); assert result.status == TransformStatus.SUCCESS; assert abs(result.twd97_x - 307056.818979) < 0.01; assert abs(result.twd97_y - 2769551.836862) < 0.01; print(result)"
          taigeotrans-wheel-smoke/bin/taigeotrans --help

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/taigeotrans/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --verify-tag
