name: Release

on:
  push:
    tags:
      - "TaiGeotrans-v.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"TaiGeotrans-v.{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --all-extras --no-install-project --no-build

      - name: Build distributions
        run: uv run --no-sync --no-build python -m build --no-isolation

      - name: Install built project wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python .venv/bin/python --no-build --no-deps "${wheels[0]}"

      - name: Run tests
        run: uv run --no-sync --no-build python -m pytest

      - name: Run Ruff lint
        run: uv run --no-sync --no-build python -m ruff check src tests

      - name: Check Ruff formatting
        run: uv run --no-sync --no-build python -m ruff format --check src tests

      - name: Run mypy
        run: uv run --no-sync --no-build python -m mypy src

      - name: Check distributions
        run: uv run --no-sync --no-build python -m twine check dist/*

      - name: Smoke test installed wheel and CLI
        shell: bash
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/taigeotrans-wheel-smoke" --python "$(command -v python)"
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --no-build --python "$RUNNER_TEMP/taigeotrans-wheel-smoke/bin/python" "${wheels[0]}[all]"
          cd "$RUNNER_TEMP"
          taigeotrans-wheel-smoke/bin/python -c "from taigeotrans import TaiGeotrans, TransformStatus; result = TaiGeotrans().transform_lonlat(121.5654, 25.0330); assert result.status == TransformStatus.SUCCESS; assert abs(result.twd97_x - 307056.818979) < 0.01; assert abs(result.twd97_y - 2769551.836862) < 0.01; print(result)"
          taigeotrans-wheel-smoke/bin/taigeotrans --help

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/taigeotrans/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --verify-tag
