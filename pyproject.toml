[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "taigeotrans"
version = "0.1.0"
description = "Taiwan Geospatial Transformer - 台灣地址與座標轉換工具"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "TaiGeotrans Contributors"}
]
keywords = ["taiwan", "geospatial", "coordinate", "transform", "TWD97", "WGS84", "geocoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "pyproj>=3.6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
geocoding = [
    "httpx>=0.27.0",
]
dataframe = [
    "pandas>=2.0.0",
]
progress = [
    "tqdm>=4.66.0",
]
cli = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
]
all = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
taigeotrans = "taigeotrans.cli:main"

[project.urls]
Homepage = "https://github.com/KageRyo/TaiGeotrans"
Repository = "https://github.com/KageRyo/TaiGeotrans"
Issues = "https://github.com/KageRyo/TaiGeotrans/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taigeotrans = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=taigeotrans --cov-report=term-missing"
